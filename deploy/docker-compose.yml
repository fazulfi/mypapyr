name: papyr-app

# ============================================================================
# Papyr deployment topology unified per Phase-5 U-COMPOSE
# (BLKR-02 part 2, BLKR-11).
#
# Single Compose project, single explicit internal network:
#   * api     - control plane; internal expose 3000; depends on healthy redis
#               and clamd so /health/ready truthfully reflects foundation +
#               queue + scanner availability.
#   * nginx   - deferred edge slot (profile "edge"); requires a healthy api.
#   * redis   - durable queue storage; digest-pinned official image; the R-09
#               AOF/noeviction persistence contract; internal-only; profile
#               "queue".
#   * workers - bounded worker (2G / 1.5 cpus, one instance per DEC-189);
#   * cleanup - scheduled expired-task cleanup pass (U-OPS); bounded posture;
#               queue profile; no public ports; image = PAPYR_API_IMAGE.
#   * monitor - production health observer (U-OPS); api/redis/clamd/queue/
#               cleanup-marker/R2 checks; queue profile; no public ports.
#               depends on healthy redis + clamd; mirrors the api hardened
#               posture; declares its own /health probe (worker entrypoint).
#   * clamd   - official ClamAV daemon; required digest-form image variable;
#               internal-only port 3310; backs API readiness and admission
#               scans; profile "queue".
#
# Profile activation safety: `--profile app` selects only api; `--profile
# queue` selects redis + workers + clamd; `--profile edge` selects nginx.
# PRODUCTION ACTIVATION runs BOTH profiles (full backend stack):
#   docker compose -p papyr-app --env-file "$PAPYR_ENV_FILE" \
#     -f deploy/docker-compose.yml --profile app --profile queue up -d
# `--profile app` ALONE is NOT production-ready (it starts api-only, with no
# redis/worker/scanner, so /health/ready would report not-ready). nginx
# (`--profile edge`) stays deferred and is excluded from the app+queue command.
# Run with `-p papyr-app` so ONE project / ONE network is used and the API
# resolves redis + clamd by stable in-project service DNS. This is the fix
# for the split-brain defect (two projects / two networks -> Redis not
# resolvable -> /health/ready 503).
#
# Immutable image contract (no mutable defaults, no hardcoded digests for
# images the repo builds; third-party digests only where authoritative):
#   * api     -> ${PAPYR_API_IMAGE:?...}     (immutable-injected, digest form)
#   * workers -> ${PAPYR_WORKERS_IMAGE:?...} (required, digest form)
#   * clamd   -> ${PAPYR_CLAMD_IMAGE:?...}   (required, digest form; must be
#               the official Alpine-based clamav/clamav image that provides
#               busybox `nc` and a clamd answering PING->PONG on TCP 3310,
#               because the healthcheck below probes exactly that contract)
#   * redis   -> redis:7.4.10-alpine@sha256:... (authoritative digest pin)
#
# Env-file strategy (fail closed): api and workers load their container
# environment from the provisioned `.env.production` via ${PAPYR_ENV_FILE:?...};
# the committed template carries empty required values so an accidental load
# fails fast at boot. The safe internal runtime contracts are set inline in
# `environment:` (which overrides env_file per Compose precedence) so the API
# and worker ALWAYS resolve Redis and clamd by Compose service DNS:
#   * REDIS_URL=redis://redis:6379/0 (service DNS, db 0, no credentials)
#   * CLAMD_HOST=clamd               (service DNS)
# Settings defaults (redis://localhost:6379/0, CLAMD_HOST=localhost) would not
# resolve across containers, so they are overridden here explicitly.
#
# Security posture: read-only rootfs, cap_drop ALL, no-new-privileges where
# feasible (clamd drops ALL; redis keeps only the caps its entrypoint needs).
# Resource limits use top-level cpus/mem_limit/pids_limit so they are
# effective for non-Swarm `docker compose`. Health probes are truthful
# (clamd PING/PONG daemon probe, never a version-only check).
# ============================================================================

services:
  api:
    image: "${PAPYR_API_IMAGE:?PAPYR_API_IMAGE required: immutable digest-form reference (registry/path@sha256:...)}"
    profiles: ["app"]
    env_file:
      - "${PAPYR_ENV_FILE:?PAPYR_ENV_FILE required: provisioned .env.production path}"
    environment:
      - CLAMD_HOST=clamd
      - REDIS_URL=redis://redis:6379/0
    networks:
      - papyr
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:exec,mode=1777,size=512M
      - /home/appuser/.cache:size=128M
      - /opt/papyr/temp:exec,mode=1777,size=512M
    cpus: "1.0"
    mem_limit: 512M
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=api"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:__SET_ME__
    profiles: ["edge"]
    networks:
      - papyr
    depends_on:
      api:
        condition: service_healthy
    ports: []
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256M
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=nginx"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  workers:
    image: "${PAPYR_WORKERS_IMAGE:?PAPYR_WORKERS_IMAGE required: immutable digest-form reference (registry/path@sha256:...)}"
    profiles: ["queue"]
    deploy:
      replicas: 1
    env_file:
      - "${PAPYR_ENV_FILE:?PAPYR_ENV_FILE required: provisioned .env.production path}"
    environment:
      - CLAMD_HOST=clamd
      - REDIS_URL=redis://redis:6379/0
    networks:
      - papyr
    depends_on:
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:exec,mode=1777,size=256M
      - /opt/papyr/workspace:exec,mode=1777,size=1G
    cpus: "1.5"
    mem_limit: 2G
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=workers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  clamd:
    image: "${PAPYR_CLAMD_IMAGE:?PAPYR_CLAMD_IMAGE required: immutable digest-form reference (registry/path@sha256:...)}"
    profiles: ["queue"]
    networks:
      - papyr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Required image contract: PAPYR_CLAMD_IMAGE must be official Alpine-based clamav/clamav
    # providing busybox `nc` and a clamd answering PING→PONG on TCP 3310
    # (docs.clamav.net Docker). This comment encodes the mandatory runtime contract.
    tmpfs:
      - /tmp:size=128M
    volumes:
      - clamd-db:/var/lib/clamav
    cpus: "0.5"
    mem_limit: 2G
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=clamd"
    healthcheck:
      # Truthful clamd liveness: TCP PING to the daemon on 3310 must be answered
      # with PONG. This is NOT a version/binary check; it fails whenever clamd
      # is not listening or not responsive, so a dead daemon cannot be healthy.
      test: ["CMD-SHELL", "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5


  cleanup:
    image: "${PAPYR_API_IMAGE:?PAPYR_API_IMAGE required: immutable digest-form reference (registry/path@sha256:...)}"
    profiles: ["queue"]
    command: ["python", "-m", "app.ops.cleanup_loop"]
    env_file:
      - "${PAPYR_ENV_FILE:?PAPYR_ENV_FILE required: provisioned .env.production path}"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CLEANUP_INTERVAL_SECONDS=300
    networks:
      - papyr
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:exec,mode=1777,size=64M
    cpus: "0.25"
    mem_limit: 256M
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=cleanup"

  monitor:
    image: "${PAPYR_API_IMAGE:?PAPYR_API_IMAGE required: immutable digest-form reference (registry/path@sha256:...)}"
    profiles: ["queue"]
    command: ["python", "-m", "app.ops.monitor", "--watch", "60"]
    env_file:
      - "${PAPYR_ENV_FILE:?PAPYR_ENV_FILE required: provisioned .env.production path}"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CLAMD_HOST=clamd
      - MONITOR_API_URL=http://api:3000/health/ready
    networks:
      - papyr
    depends_on:
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:exec,mode=1777,size=64M
    cpus: "0.25"
    mem_limit: 256M
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=monitor"

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: ["queue"]
    networks:
      - papyr
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "3600 1 300 100 60 10000"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 768M
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.papyr.service=redis"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli info memory | awk -F: -v warn=80 '/^used_memory:/{u=$2} /^maxmemory:/{m=$2} END{if(m>0){pct=u*100/m; printf \"redis memory %d%% of maxmemory\\n\", pct; if(pct>=warn) print \"WARNING redis memory watermark reached; noeviction will reject writes\"}}'"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  papyr:
    driver: bridge
    internal: false

volumes:
  clamd-db:
    driver: local
  redis-data:
    driver: local
