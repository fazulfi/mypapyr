#
# Papyr production server block
# Hardened: Cloudflare real-IP, rate limiting, security headers, bot/path blocking.
# TLS termination deferred: domain and cert paths are __SET_ME__ placeholders
# replaced during the authorized release procedure.
#

# --- Rate limiting zones (keyed on real client IP via CF-Connecting-IP) -----
limit_req_zone $binary_remote_addr zone=papyr_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=papyr_burst:10m rate=2r/s;

# --- Map bad User-Agents to block bots early ---------------------------------
map $http_user_agent $bad_bot {
    default 0;
    "~*(nikto|sqlmap|fimap|nessus|whatweb|openvas|jaeles|gobuster|dirbuster|feroxbuster|wapiti|skipfish|w3af|paros|zaproxy|burp)" 1;
    "~*(masscan|zmap|nmap)" 1;
    "~*(zgrab|petalbot|semrushbot|mj12bot|ahrefsbot|dotbot|seznambot)" 1;
    "" 1;
}

# --- Map sensitive paths to 444 (drop connection, no response) ----------------
map $request_uri $blocked_path {
    default 0;
    "~*\.(env|git|svn|htaccess|htpasswd|sql|bak|backup|swp|old|orig)" 1;
    "~*/wp-(admin|login|content|includes)" 1;
    "~*/(phpmyadmin|adminer|setup\.php|xmlrpc\.php)" 1;
    "~*\.\.\/" 1;
}

# --- Fail-closed default server -----------------------------------------------
# Drop requests for any Host header that doesn't match the production server_name.
# This is the ONLY default_server in conf.d, so unmatched Hosts get 444.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# --- API upstream --------------------------------------------------------------
upstream papyr_api_upstream {
    server api:3000;
    keepalive 32;
}

# --- Production server block ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Placeholder domain — REPLACE during the authorized release procedure.
    server_name __SET_ME__;

    # --- Cloudflare Real IP ----------------------------------------------------
    # So logs and rate limits use the real client IP address.
    # Refresh quarterly from https://www.cloudflare.com/ips-v4 / ips-v6
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # --- Bad bot / path blocking (maps defined above) ---------------------------
    if ($bad_bot)      { return 403; }
    if ($blocked_path) { return 444; }

    # --- Hardening basics -------------------------------------------------------
    server_tokens off;
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # --- Security headers -------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is deferred until TLS is provisioned:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Static assets / cache-friendly paths -----------------------------------
    location /static/ {
        alias /var/www/papyr/static/;
        access_log off;
        expires 30d;
    }

    # --- Health endpoints (no rate limit) ---------------------------------------
    location = /health {
        proxy_pass http://papyr_api_upstream/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://papyr_api_upstream/health/ready;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- API endpoints (rate limited) -------------------------------------------
    location /api/ {
        limit_req zone=papyr_api burst=60 nodelay;
        limit_req zone=papyr_burst burst=10;

        proxy_pass http://papyr_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Long timeouts for async compression / conversion tasks
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- Catch-all: return 444 (drop connection silently) -----------------------
    location / {
        return 444;
    }
}
