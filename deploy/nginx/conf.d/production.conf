# Papyr Nginx server-block template.
#
# SKELETON ONLY. No real domain, no real TLS certs, no real upstreams.
# All placeholders use __SET_ME__ so an unintended publish cannot leak a
# value. This file is mounted read-only by compose (`nginx/conf.d`) and has
# no effect until nginx has a real image tag, host port, TLS policy, and
# a verified healthcheck utility.

# Fail-closed default server: this template's server block is the
# only one in conf.d, so without a default_server nginx would answer ANY
# Host header with the placeholder block. Requests with any Host other than
# the placeholder server_name get 444 (connection dropped, no response).
# Releases must retain this posture when the real server_name lands.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

upstream papyr_api_upstream {
    # Placeholder upstream name. The api service is exposed on its compose
    # network at the service name `api` on port 3000 (see docker-compose.yml).
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Placeholder domain. Replace through the authorized release procedure.
    server_name __SET_ME__;

    # TLS termination is intentionally omitted from this public template.
    # Provision certificates and the final TLS policy during release.

    # Static assets / cache-friendly paths
    location /static/ {
        alias /var/www/papyr/static/;
        access_log off;
        expires 30d;
    }

    # Application reverse proxy
    location / {
        proxy_pass http://papyr_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Health route aligned with the liveness contract the app,
    # image, and compose healthchecks all probe — GET /health
    # (backend/app/main.py). Readiness lives at GET /health/ready
    # (backend/app/health.py, additive) and is available for release-time
    # load-balancer wiring; it is not probed here.
    location = /health {
        proxy_pass http://papyr_api_upstream/health;
        access_log off;
    }
}
